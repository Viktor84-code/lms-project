[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lms-project"
version = "0.1.0"
description = "LMS system on Django + DRF"
requires-python = ">=3.10"
dependencies = [
    "Django>=6.0.7",
    "djangorestframework>=3.17.1",
    "djangorestframework-simplejwt>=5.5.1",
    "django-filter>=26.1",
    "django-celery-beat>=2.9.0",
    "celery>=5.6.3",
    "redis>=8.1.0",
    "eventlet>=0.41.1",
    "drf-yasg>=1.21.15",
    "stripe>=15.4.0",
    "Pillow>=12.3.0",
    "python-dotenv>=1.2.2",
    "psycopg2-binary>=2.9.0",
    "gunicorn>=21.2.0",
]

[tool.black]
line-length = 119
target-version = ['py310']
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 119
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = ".venv,venv,migrations"

[tool.flake8]
max-line-length = 119
exclude = ".venv,venv,migrations,__pycache__"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
plugins = ["mypy_django_plugin.main"]

[tool.pytest.ini_options]
python_files = "test_*.py"
testpaths = ["tests"]
addopts = "--cov=."
